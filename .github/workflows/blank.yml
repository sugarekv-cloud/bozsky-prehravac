name: Publish FCKYO repozitář

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install requests pillow
      - name: Validate Python and integration tests
        run: |
          python -m compileall -q plugin.video.fckyo
          python -m unittest discover -s tests -v
      - name: Repeat Cinema TV regression checks 100 times
        shell: bash
        run: |
          for round in $(seq 1 100); do
            if ! python -m unittest discover -s tests -p 'test_cinema_036_tv.py' -q > /tmp/cinema-036-check.log 2>&1; then
              echo "Cinema regression run ${round}/100 FAILED"
              cat /tmp/cinema-036-check.log
              exit 1
            fi
          done
          echo "Cinema TV design checks: 100/100 passed"
      - name: Build Kodi repository
        run: python build_repo.py --owner sugarekv-cloud --output site
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
